seed: 0

env:
  max_steps: 1000
  scenario_name: "balance"
  scenario:
    n_agents: 3
  device: ??? # These values will be populated dynamically
  vmas_envs: ???

model:
  shared_parameters: True

collector:
  frames_per_batch: 4 # Frames sampled each sampling iteration
  n_iters: 200000 # Number of sampling/training iterations
  total_frames: ???

buffer:
  memory_size: ???

loss:
  mixer_type: "qmix"  # or "vdn"
  gamma: 0.99
  tau: 0.005 # For target net

train:
  num_epochs: 1  # optimization steps per batch of data collected
  minibatch_size: 32 # size of minibatches used in each epoch
  lr: 1e-5
  max_grad_norm: 40.0
  device: ???
  pretrained_qnet_path: 'models/qnet_model.pth'
  #pretrained_mixer_path: 'models/mixer_model.pth'


eval:
  evaluation_interval: 10000
  evaluation_episodes: 5

logger:
  backend: wandb # Delete to remove logging
  project_name: qmix
  group_name: null
